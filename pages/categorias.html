<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorias - Mercearia Stock</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/tables.css"><link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar"><div class="sidebar-brand"><i class="fa-solid fa-store"></i><h2>Mercearia</h2></div><nav><ul id="menuList"></ul></nav></aside>
  <main class="content">
    <header class="topbar"><div class="topbar-left"><button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button><h1>Categorias</h1></div><button id="logoutBtn" class="btn btn-danger btn-sm">Terminar Sessão</button></header>
    <div class="page-header"><p>Gestão de categorias</p><button class="btn btn-primary" id="btnNovo"><i class="fa-solid fa-plus"></i> Adicionar</button></div>
    <div class="search-bar"><input type="text" id="pesquisa" placeholder="Pesquisar categoria..."></div>
    <p id="msg" class="form-message"></p>
    <div class="table-wrap"><table><thead><tr><th>ID</th><th>Nome</th><th>Estado</th><th>Produtos</th><th>Acções</th></tr></thead><tbody id="tabela"></tbody></table></div>
  </main>
</div>
<div class="modal" id="modalForm"><div class="modal-content">
  <div class="modal-header"><h2 id="modalTitulo">Adicionar Categoria</h2><button class="modal-close" data-close-modal="modalForm">&times;</button></div>
  <form id="formCat"><input type="hidden" id="catId">
    <div class="form-group"><label>Nome *</label><input id="nome" required></div>
    <div class="form-group"><label>Estado</label><select id="estado"><option value="ACTIVO">ACTIVO</option><option value="INACTIVO">INACTIVO</option></select></div>
    <button type="submit" class="btn btn-primary btn-block">Guardar</button>
  </form><p id="formMsg" class="form-message"></p>
</div></div>
<script src="../js/database.js"></script><script src="../js/session.js"></script><script src="../js/utils.js"></script><script src="../js/layout.js"></script><script src="../js/categorias.js"></script>
</body></html>
