<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos - Mercearia Stock</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/tables.css"><link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar"><div class="sidebar-brand"><i class="fa-solid fa-store"></i><h2>Mercearia</h2></div><nav><ul id="menuList"></ul></nav></aside>
  <main class="content">
    <header class="topbar">
      <div class="topbar-left"><button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button><h1>Produtos</h1></div>
      <button id="logoutBtn" class="btn btn-danger btn-sm"><i class="fa-solid fa-right-from-bracket"></i> Terminar Sessão</button>
    </header>
    <div class="page-header"><p id="subtitulo">Gestão de produtos</p><button class="btn btn-primary" id="btnNovo" style="display:none"><i class="fa-solid fa-plus"></i> Adicionar Produto</button></div>
    <div class="search-bar">
      <input type="text" id="pesquisa" placeholder="Pesquisar produto...">
      <select id="filtroCategoria"><option value="">Todas as categorias</option></select>
      <select id="filtroEstado"><option value="">Todos os estados</option><option value="NORMAL">NORMAL</option><option value="STOCK BAIXO">STOCK BAIXO</option><option value="ESGOTADO">ESGOTADO</option></select>
    </div>
    <p id="msg" class="form-message"></p>
    <div class="table-wrap"><table><thead><tr><th>Código</th><th>Nome</th><th>Categoria</th><th>Preço Venda</th><th>Stock</th><th>Estado Stock</th><th>Validade</th><th id="colAccoes">Acções</th></tr></thead><tbody id="tabela"></tbody></table></div>
  </main>
</div>
<div class="modal" id="modalForm">
  <div class="modal-content" style="width:min(640px,100%)">
    <div class="modal-header"><h2 id="modalTitulo">Adicionar Produto</h2><button class="modal-close" data-close-modal="modalForm">&times;</button></div>
    <form id="formProduto">
      <input type="hidden" id="prodId">
      <div class="form-row">
        <div class="form-group"><label>Código</label><input id="codigo" placeholder="Automático se vazio"></div>
        <div class="form-group"><label>Nome *</label><input id="nome" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Categoria</label><select id="categoriaId"></select></div>
        <div class="form-group"><label>Marca</label><input id="marca"></div>
      </div>
      <div class="form-group"><label>Unidade</label><select id="unidade"><option>Unidade</option><option>Caixa</option><option>Kg</option><option>Grama</option><option>Litro</option><option>Pacote</option><option>Saco</option></select></div>
      <div class="form-row">
        <div class="form-group"><label>Preço Compra</label><input id="precoCompra" type="number" min="0" step="0.01"></div>
        <div class="form-group"><label>Preço Venda *</label><input id="precoVenda" type="number" min="0" step="0.01" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Quantidade em Stock</label><input id="stock" type="number" min="0"></div>
        <div class="form-group"><label>Stock Mínimo</label><input id="stockMinimo" type="number" min="0"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Data de Validade</label><input id="dataValidade" type="date"></div>
        <div class="form-group"><label>Estado</label><select id="estado"><option value="ACTIVO">ACTIVO</option><option value="INACTIVO">INACTIVO</option></select></div>
      </div>
      <div class="form-group"><label>Descrição</label><textarea id="descricao" rows="2"></textarea></div>
      <button type="submit" class="btn btn-primary btn-block">Guardar</button>
    </form>
    <p id="formMsg" class="form-message"></p>
  </div>
</div>
<script src="../js/database.js"></script><script src="../js/session.js"></script><script src="../js/utils.js"></script><script src="../js/layout.js"></script><script src="../js/produtos.js"></script>
</body></html>
