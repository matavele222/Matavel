<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilizadores - Mercearia Stock</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/tables.css"><link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar"><div class="sidebar-brand"><i class="fa-solid fa-store"></i><h2>Mercearia</h2></div><nav><ul id="menuList"></ul></nav></aside>
  <main class="content">
    <header class="topbar">
      <div class="topbar-left"><button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button><h1>Utilizadores</h1></div>
      <button id="logoutBtn" class="btn btn-danger btn-sm"><i class="fa-solid fa-right-from-bracket"></i> Terminar Sessão</button>
    </header>
    <div class="page-header"><p>Gestão de vendedores</p><button class="btn btn-primary" id="btnNovo"><i class="fa-solid fa-plus"></i> Adicionar Vendedor</button></div>
    <div class="search-bar"><input type="text" id="pesquisa" placeholder="Pesquisar vendedor..."></div>
    <p id="msg" class="form-message"></p>
    <div class="table-wrap"><table><thead><tr><th>ID</th><th>Nome</th><th>Username</th><th>Perfil</th><th>Estado</th><th>Data Cadastro</th><th>Acções</th></tr></thead><tbody id="tabela"></tbody></table></div>
  </main>
</div>
<div class="modal" id="modalForm">
  <div class="modal-content">
    <div class="modal-header"><h2 id="modalTitulo">Adicionar Vendedor</h2><button class="modal-close" data-close-modal="modalForm">&times;</button></div>
    <form id="formUtilizador">
      <input type="hidden" id="userId">
      <div class="form-group"><label>Nome completo *</label><input id="nome" required></div>
      <div class="form-row">
        <div class="form-group"><label>Username *</label><input id="username" required></div>
        <div class="form-group"><label>Telefone</label><input id="telefone"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Palavra-passe *</label><input id="password" type="password"></div>
        <div class="form-group"><label>Confirmar Palavra-passe *</label><input id="passwordConfirm" type="password"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Perfil</label><input id="perfil" value="VENDEDOR" readonly></div>
        <div class="form-group"><label>Estado</label><select id="estado"><option value="ACTIVO">ACTIVO</option><option value="INACTIVO">INACTIVO</option></select></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Guardar</button>
    </form>
    <p id="formMsg" class="form-message"></p>
  </div>
</div>
<script src="../js/database.js"></script><script src="../js/session.js"></script><script src="../js/utils.js"></script><script src="../js/layout.js"></script><script src="../js/utilizadores.js"></script>
</body></html>
